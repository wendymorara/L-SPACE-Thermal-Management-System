@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec def "RegulateWebTemperature" as E1  <<(T,blue) action  def>> [[psysml:5fae1411-dcca-4d2e-b572-5cd1e472c8d5 ]] {
rec usage "sense" as E2  <<(T,blue) action>> [[psysml:339ac8d4-33b7-4f2c-9926-c8787bdc76cd ]] {
portout "^temperature" as E3  [[psysml:7bcc5830-cfb8-4781-86ce-7fb238032d5d ]] 
}

rec usage "validate" as E4  <<(T,blue) action>> [[psysml:574ff91d-a22b-4f80-8f3d-d85e8857585e ]] {
portout "^zoneTemperature" as E5  [[psysml:f3e4b0b0-6ed6-4bc5-9372-726a6b100a5a ]] 
portin "^temperature" as E6  [[psysml:f4c34212-9408-4803-babb-c61de6a8a768 ]] 
}

rec usage "compute" as E7  <<(T,blue) action>> [[psysml:dcf6eab3-079b-4d38-bdf4-fb4e19a4823d ]] {
portout "^heaterOn" as E8  [[psysml:cb763828-e1cc-44c7-96b5-33341ee9508f ]] 
portin "^zoneTemperature" as E9  [[psysml:634d507b-671f-4aee-b6be-6c60d5845767 ]] 
}

rec usage "actuate" as E10  <<(T,blue) action>> [[psysml:9a860396-ba8b-4673-9957-0d65c6637458 ]] {
portin "^heaterOn" as E11  [[psysml:1a138079-c752-4081-9e6b-5b911e953e44 ]] 
}

rec usage "report" as E12  <<(T,blue) action>> [[psysml:a89f95f8-bfee-4098-9efa-b8f1dd3a34e0 ]] {
portin "^zoneTemperature" as E13  [[psysml:d8406161-7047-4c63-b300-ddbfba9a87b3 ]] 
}

}

